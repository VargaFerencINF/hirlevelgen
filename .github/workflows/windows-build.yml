name: Windows build és teszt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # a main ágon kiadás (Release) készül az exe-vel

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Egységtesztek
        run: go test ./...

      - name: Exe fordítása
        shell: bash
        run: |
          VERSION="1.0.0-${GITHUB_SHA::7}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o dist/EnergofishHirlevel.exe .
          cp demo/Energofish_partner_hirlevel_minta.xlsx dist/

      - name: Önteszt (mindhárom sablon, 21 partner, EML)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-onteszt','-beallitasok',"$env:RUNNER_TEMP\cfg" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfg\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "önteszt hiba: $($p.ExitCode)" }

      - name: Batch generálás a minta Excelből
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-batch','-excel','dist\Energofish_partner_hirlevel_minta.xlsx','-sablon','v4','-kimenet',"$env:RUNNER_TEMP\kimenet",'-eml','-beallitasok',"$env:RUNNER_TEMP\cfg2" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfg2\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "batch hiba: $($p.ExitCode)" }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\kimenet" | Select-Object -First 12 FullName

      - name: Ablak-teszt (WebView2) és képernyőkép
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\cfg3\naplo.txt"
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-fustteszt','-beallitasok',"$env:RUNNER_TEMP\cfg3" -PassThru
          $t = 0
          while ($t -lt 60 -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Mozilla' -Quiet))) { Start-Sleep -Milliseconds 500; $t += 0.5 }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force kepernyokep | Out-Null
          $bmp.Save("kepernyokep\ablak.png")
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "időtúllépés" }
          Get-Content $log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "ablak-teszt hiba: $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepernyokep
          path: kepernyokep/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: EnergofishHirlevel
          path: dist/

      - name: Kiadás (Release) a main ágon
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Energofish Partnerhírlevél-generátor 1.0.${{ github.run_number }}
          body: |
            Letöltés: **EnergofishHirlevel.exe** (telepítés nélkül, dupla kattintással indul) és a minta Excel.
            Commit: ${{ github.sha }}
          files: |
            dist/EnergofishHirlevel.exe
            dist/Energofish_partner_hirlevel_minta.xlsx
