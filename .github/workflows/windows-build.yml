name: Windows build és teszt

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # a main ágon kiadás (Release) készül az exe-vel

jobs:
  windows:
    runs-on: windows-latest
    env:
      # opcionális: ha a repó Settings › Secrets alatt be van állítva, a CI az élő B2B HU exportot is ellenőrzi
      HAS_B2B_HU: ${{ secrets.WEBGALAMB_TOKEN_B2B_HU != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Egységtesztek
        run: go test ./...

      - name: Exe fordítása
        shell: bash
        run: |
          VERSION="1.3.${GITHUB_RUN_NUMBER}"
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
            -ldflags "-s -w -H windowsgui -X main.version=${VERSION}" \
            -o dist/EnergofishHirlevel.exe .
          cp demo/Energofish_partner_hirlevel_minta.xlsx dist/

      - name: Önteszt (mindhárom sablon, 21 partner, EML)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-onteszt','-beallitasok',"$env:RUNNER_TEMP\cfg" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfg\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "önteszt hiba: $($p.ExitCode)" }

      - name: Élő cikktörzs letöltése és feldolgozása (energofish.hu)
        continue-on-error: true   # a külső szerver elérhetetlensége ne akassza meg a kiadást
        timeout-minutes: 15
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-feedteszt','-beallitasok',"$env:RUNNER_TEMP\cfgfeed" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfgfeed\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "cikktörzs-teszt hiba: $($p.ExitCode)" }

      - name: Élő B2B HU partnertörzs ellenőrzése (csak ha a WEBGALAMB_TOKEN_B2B_HU titok be van állítva)
        if: env.HAS_B2B_HU == 'true'
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        env:
          WEBGALAMB_TOKEN_B2B_HU: ${{ secrets.WEBGALAMB_TOKEN_B2B_HU }}
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-partnerteszt','B2B_HU','-beallitasok',"$env:RUNNER_TEMP\cfgb2b" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfgb2b\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "partnertörzs-teszt hiba: $($p.ExitCode)" }

      - name: Batch generálás a minta Excelből
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-batch','-excel','dist\Energofish_partner_hirlevel_minta.xlsx','-sablon','v4','-kimenet',"$env:RUNNER_TEMP\kimenet",'-eml','-beallitasok',"$env:RUNNER_TEMP\cfg2" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\cfg2\naplo.txt" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "batch hiba: $($p.ExitCode)" }
          Get-ChildItem -Recurse "$env:RUNNER_TEMP\kimenet" | Select-Object -First 12 FullName

      - name: Ablak-teszt (WebView2) és képernyőkép
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\cfg3\naplo.txt"
          $p = Start-Process -FilePath dist\EnergofishHirlevel.exe -ArgumentList '-fustteszt','-beallitasok',"$env:RUNNER_TEMP\cfg3" -PassThru
          $t = 0
          while ($t -lt 60 -and -not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'Mozilla' -Quiet))) { Start-Sleep -Milliseconds 500; $t += 0.5 }
          Start-Sleep -Seconds 4
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force kepernyokep | Out-Null
          $bmp.Save("kepernyokep\ablak.png")
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw "időtúllépés" }
          Get-Content $log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "ablak-teszt hiba: $($p.ExitCode)" }

      - name: Valódi cikktörzs-gyorsítótár előkészítése (mint egy használt gépen)
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $cache = Join-Path $env:RUNNER_TEMP 'feedcache\cikktorzs'
          New-Item -ItemType Directory -Force $cache | Out-Null
          $feed = 'https://energofish.hu/listak/feeds/wholesale/termekadatok_hu.xml'
          $xml = Join-Path $env:RUNNER_TEMP 'termekadatok.xml'
          Invoke-WebRequest -Uri $feed -OutFile $xml
          $in = [IO.File]::OpenRead($xml)
          $out = [IO.File]::Create((Join-Path $cache 'termekadatok.xml.gz'))
          $gz = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionMode]::Compress)
          $in.CopyTo($gz); $gz.Dispose(); $out.Dispose(); $in.Dispose()
          $meta = @{ url = $feed; etag = ''; lastModified = ''; fetchedAt = (Get-Date).ToUniversalTime().ToString('o'); count = 12433 } | ConvertTo-Json
          Set-Content -Path (Join-Path $cache 'termekadatok.json') -Value $meta -Encoding utf8NoBOM
          Get-ChildItem $cache | ForEach-Object { Write-Host "$($_.Name) $($_.Length)" }

      - name: "Diagnózis: az előző kiadás (v1.3.7) ékezetes mappából, mentett cikktörzzsel"
        continue-on-error: true
        timeout-minutes: 6
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'regi.exe'
          gh release download v1.3.7 --repo $env:GITHUB_REPOSITORY --pattern EnergofishHirlevel.exe --output $exe
          foreach ($gogc in @('100', '1')) {
            $dir = Join-Path $env:RUNNER_TEMP "régi hírlevél $gogc\Program 1.3"
            $cfg = Join-Path $env:RUNNER_TEMP "cfg-regi-$gogc"
            New-Item -ItemType Directory -Force $dir, $cfg | Out-Null
            Copy-Item $exe (Join-Path $dir 'EnergofishHirlevel.exe')
            if (Test-Path "$env:RUNNER_TEMP\feedcache\cikktorzs") { Copy-Item -Recurse "$env:RUNNER_TEMP\feedcache\cikktorzs" $cfg }
            $env:GOGC = $gogc
            $p = Start-Process -FilePath (Join-Path $dir 'EnergofishHirlevel.exe') -ArgumentList '-fustteszt','-beallitasok',$cfg -WorkingDirectory $dir -PassThru
            if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Host "GOGC=${gogc}: a régi változat nem lépett ki 60 mp alatt (hibaablak?)" }
            $dirs = @(Get-ChildItem $dir -Directory)
            Write-Host "GOGC=${gogc}: $($dirs.Count) mappa a régi program mellett"
            $dirs | ForEach-Object { Write-Host "   $($_.Name)" }
          }

      - name: Ablak-teszt ékezetes mappából, mentett cikktörzzsel és agresszív szemétgyűjtéssel (WebView2 adatmappa)
        shell: pwsh
        run: |
          foreach ($gogc in @('100', '1')) {
            $dir = Join-Path $env:RUNNER_TEMP "hírlevél próba $gogc\Program 1.3"
            $cfg = Join-Path $env:RUNNER_TEMP "cfg-uj-$gogc"
            New-Item -ItemType Directory -Force $dir, $cfg | Out-Null
            Copy-Item dist\EnergofishHirlevel.exe $dir
            if (Test-Path "$env:RUNNER_TEMP\feedcache\cikktorzs") { Copy-Item -Recurse "$env:RUNNER_TEMP\feedcache\cikktorzs" $cfg }
            $env:GOGC = $gogc
            $p = Start-Process -FilePath (Join-Path $dir 'EnergofishHirlevel.exe') -ArgumentList '-fustteszt','-beallitasok',$cfg -WorkingDirectory $dir -PassThru
            if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "GOGC=${gogc}: időtúllépés" }
            Get-Content (Join-Path $cfg 'naplo.txt') -ErrorAction SilentlyContinue
            $extra = @(Get-ChildItem $dir -Directory)
            if ($extra.Count) { $extra | ForEach-Object { Write-Host "VÁRATLAN MAPPA: $($_.Name)" }; throw "GOGC=${gogc}: a program mappájában mappa keletkezett" }
            if ($p.ExitCode -ne 0) { throw "GOGC=${gogc}: ablak-teszt hiba: $($p.ExitCode)" }
            Write-Host "GOGC=${gogc} rendben: a program mappája tiszta"
          }
          if (-not (Test-Path "$env:LOCALAPPDATA\EnergofishHirlevel\WebView2")) { throw "nincs WebView2 adatmappa a LOCALAPPDATA alatt" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kepernyokep
          path: kepernyokep/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: EnergofishHirlevel
          path: dist/

      - name: Kiadás (Release) a main ágon
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.${{ github.run_number }}
          name: Energofish Partnerhírlevél-generátor 1.3.${{ github.run_number }}
          body: |
            Letöltés: **EnergofishHirlevel.exe** (telepítés nélkül, dupla kattintással indul) és a minta Excel.
            Újdonság az 1.3-ban: partnerek a B2B partnertörzsből – célcsoport (ország) választás, partnerhalmaz képviselő, megye, besorolás és más tulajdonságok szerint, mentett halmazok, szinkron a leiratkozottak kiszűrésével, frissítés minden generálás előtt.
            1.2: „Új termék” keresés a friss cikktörzsben, a mezők automatikus kitöltése, képméret-váltó.
            Commit: ${{ github.sha }}
          files: |
            dist/EnergofishHirlevel.exe
            dist/Energofish_partner_hirlevel_minta.xlsx
